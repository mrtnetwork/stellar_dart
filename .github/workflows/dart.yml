name: Dart

# Three backends: pure Dart (VM + browser) and Rust FFI (VM).
# There are no WASM-backend test entries yet (no test/wasm_assets consumers),
# so no wasm build job: `dart test -p chrome` exercises the pure-Dart suite
# compiled to JS. The Rust crate is checked out from
# mrtnetwork/blockchain-utils ($BU_RUST_CRATE) for the FFI job.
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  BU_RUST_CRATE: ${{ github.workspace }}/rust-crate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-vm:
    name: Dart backend (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BU_BACKEND: dart
    steps:
      - name: Checkout stellar_dart
        uses: actions/checkout@v4
        with:
          path: stellar_dart

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: stellar_dart
        run: dart pub get --no-example

      - name: Analyze
        working-directory: stellar_dart
        run: dart analyze lib test tool

      - name: Run tests (pure Dart)
        working-directory: stellar_dart
        run: dart test test --timeout=5m

  ffi-vm:
    name: Rust FFI backend (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BU_BACKEND: ffi
    steps:
      - name: Checkout stellar_dart
        uses: actions/checkout@v4
        with:
          path: stellar_dart

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Checkout Rust crate
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain-utils
          path: rust-crate

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-crate -> target"

      - name: Install dependencies
        working-directory: stellar_dart
        run: dart pub get --no-example

      - name: Analyze
        working-directory: stellar_dart
        run: dart analyze lib test tool

      - name: Build FFI backend
        working-directory: stellar_dart
        run: dart tool/build_backends.dart --ffi

      - name: Run tests (FFI)
        working-directory: stellar_dart
        run: dart test test --timeout=5m

  dart-web:
    name: Dart backend (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout stellar_dart
        uses: actions/checkout@v4
        with:
          path: stellar_dart

      - name: Checkout blockchain_utils (path dependency)
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain_utils
          path: blockchain_utils

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: stellar_dart
        run: dart pub get --no-example

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run browser tests (pure Dart)
        working-directory: stellar_dart
        env:
          CHROME_EXECUTABLE: /tmp/chrome-nosandbox.sh
        run: dart test -p chrome test --timeout=20m
